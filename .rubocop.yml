AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - playground/**/*
    - vendor/**/*

# idempotent?(verbose: true) returns { result:, reason: } on purpose.
Naming/PredicateMethod:
  AllowedMethods:
    - idempotent?

Metrics/MethodLength:
  Exclude:
    - test/**/*
